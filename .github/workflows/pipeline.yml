name: Daily pipeline

on:
  schedule:
    # 06:00 UTC daily (NFR5.1: well within the 10-minute expected run time).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fca-pulse-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run ingestion, classification, and site build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m fca_pulse.pipeline --db data/archive.db --site-dir docs

      - name: Commit archive and site updates
        run: |
          git config user.name "fca-pulse-bot"
          git config user.email "fca-pulse-bot@users.noreply.github.com"
          git add data/archive.db docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily ingestion run $(date -u +%Y-%m-%d)"
            git push
          fi
